<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
    <style>
        .community-hero { text-align: center; padding: 48px 0 32px; }
        .community-hero h1 { font-size: 28px; font-weight: 800; }
        .community-hero p { color: var(--text-secondary); margin-top: 8px; font-size: 15px; }
        .community-list { display: flex; flex-direction: column; gap: 16px; max-width: 800px; margin: 0 auto; padding-bottom: 60px; }
        .community-card { background: var(--bg-card); border-radius: 14px; border: 1px solid var(--border-color); padding: 24px; transition: all 0.2s; }
        .community-card:hover { border-color: var(--border-hover); }
        .community-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .community-card-author { font-size: 13px; color: var(--accent-cyan); font-weight: 500; }
        .community-card-date { font-size: 12px; color: var(--text-muted); }
        .community-card-title { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; line-height: 1.4; }
        .community-card-title a { color: inherit; text-decoration: none; }
        .community-card-title a:hover { color: var(--accent-cyan); }
        .community-card-summary { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 12px; }
        .community-card-footer { display: flex; gap: 16px; font-size: 13px; color: var(--text-muted); }
        .community-empty { text-align: center; padding: 80px 20px; color: var(--text-muted); }
        .community-empty p { font-size: 15px; margin-bottom: 16px; }
        .community-loading { text-align: center; padding: 60px; color: var(--text-muted); }
        #communityLoadMore { display: none; justify-content: center; padding: 20px 0 60px; }
        @media (max-width: 640px) { .community-card { padding: 16px; } }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon">✦</span>
                <span class="logo-text">AIHOTNESS</span>
                <span class="logo-badge">BETA</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link" data-section="news"><span class="nav-icon">🔥</span> 热点新闻</a>
                <a href="/papers" class="nav-link" data-section="papers"><span class="nav-icon">📄</span> 论文</a>
                <a href="/tutorials" class="nav-link" data-section="tutorials"><span class="nav-icon">📚</span> AI教程</a>
                <a href="/community" class="nav-link active" data-section="community"><span class="nav-icon">✍️</span> 社区</a>
            </div>
            <div class="nav-right">
                <a href="/editor" class="btn btn-sm btn-primary nav-write-btn">✏️ 写文章</a>
                <button id="themeToggle" class="theme-toggle" aria-label="切换主题">
                    <span class="theme-icon">☀️</span>
                </button>
                <div class="auth-section">
                    <div id="guestLinks" class="auth-section">
                        <a href="/login" class="nav-link auth-link">登录</a>
                        <a href="/register" class="nav-link auth-link auth-register">注册</a>
                    </div>
                    <div id="userMenu" class="user-menu" style="display:none;">
                        <div class="user-dropdown">
                            <button class="user-dropdown-trigger">
                                <span id="userDisplayName">用户</span>
                                <span class="dropdown-arrow">▾</span>
                            </button>
                            <div class="dropdown-menu">
                                <a href="/profile">我的文章</a>
                                <a href="/admin" id="adminLink" style="display:none;">管理后台</a>
                                <div class="dropdown-divider"></div>
                                <a href="#" id="logoutBtn">退出登录</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <div class="community-hero">
                <h1>✍️ 社区原创</h1>
                <p>来自社区用户的原创 AI 文章</p>
            </div>

            <div class="community-list" id="communityList">
                <div class="community-loading"><div class="spinner"></div><p>加载中...</p></div>
            </div>

            <div id="communityLoadMore">
                <button class="btn btn-outline" onclick="loadMoreCommunity()">加载更多</button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-container">
            <div class="footer-brand">
                <span class="footer-logo">✦ AIHOTNESS</span>
                <p class="footer-desc">AI 热点资讯聚合平台</p>
            </div>
            <div class="footer-links">
                <span class="footer-tag"># AIHOTNESS</span>
                <span class="footer-tag">Built with DeepSeek</span>
            </div>
        </div>
    </footer>

    <div class="toast" id="toast"></div>

    <script src="/static/js/main.js"></script>
    <script>
    const communityState = { offset: 0, limit: 30, hasMore: true, loading: false };

    async function loadCommunityArticles(reset) {
        if (communityState.loading) return;
        communityState.loading = true;

        if (reset) {
            communityState.offset = 0;
            communityState.hasMore = true;
        }

        const params = new URLSearchParams({
            limit: String(communityState.limit),
            offset: String(communityState.offset),
        });

        try {
            const resp = await fetch('/api/community/articles?' + params);
            const data = await resp.json();
            const list = document.getElementById('communityList');

            if (reset) list.innerHTML = '';

            if (!data.articles || data.articles.length === 0) {
                if (reset) {
                    list.innerHTML = '<div class="community-empty"><p>还没有社区文章</p><a href="/editor" class="btn btn-primary">✏️ 写第一篇文章</a></div>';
                }
                communityState.hasMore = false;
                document.getElementById('communityLoadMore').style.display = 'none';
                communityState.loading = false;
                return;
            }

            const html = data.articles.map(function(a) {
                const date = a.published_at ? a.published_at.slice(0, 10) : '';
                const category = a.category || '';
                const author = a.author || '匿名';
                const summary = a.summary || (a.content_md ? a.content_md.slice(0, 200) : '') || '';
                return '<div class="community-card">' +
                    '<div class="community-card-header">' +
                        '<span class="community-card-author">✍️ ' + escapeHtml(author) + '</span>' +
                        (category ? '<span class="card-tag">' + escapeHtml(category) + '</span>' : '') +
                        '<span class="community-card-date">' + date + '</span>' +
                    '</div>' +
                    '<div class="community-card-title"><a href="/article/' + a.id + '">' + escapeHtml(a.title) + '</a></div>' +
                    (summary ? '<div class="community-card-summary">' + escapeHtml(summary) + '</div>' : '') +
                    '<div class="community-card-footer">' +
                        '<span>❤️ ' + (a.like_count || 0) + '</span>' +
                        '<span>💬 ' + (a.comment_count || 0) + '</span>' +
                    '</div>' +
                '</div>';
            }).join('');

            if (reset) list.innerHTML = html;
            else list.insertAdjacentHTML('beforeend', html);

            communityState.offset = data.offset + data.articles.length;
            communityState.hasMore = data.articles.length === communityState.limit;
            document.getElementById('communityLoadMore').style.display = communityState.hasMore ? 'flex' : 'none';
            communityState.loading = false;
        } catch (e) {
            document.getElementById('communityList').innerHTML = '<div class="community-empty"><p>加载失败</p></div>';
            communityState.loading = false;
        }
    }

    function loadMoreCommunity() { loadCommunityArticles(false); }

    // Init
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() { setTimeout(function() { loadCommunityArticles(true); }, 200); });
    } else {
        setTimeout(function() { loadCommunityArticles(true); }, 200);
    }
    </script>
</body>
</html>
