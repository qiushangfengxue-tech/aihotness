<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
</head>
<body>
    <canvas id="particles"></canvas>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon">✦</span>
                <span class="logo-text">AIHOTNESS</span>
                <span class="logo-badge">BETA</span>
            </a>
            <div class="nav-right">
                <button id="themeToggle" class="theme-toggle" aria-label="切换主题">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="auth-page">
                <div class="auth-card">
                    <div class="auth-header">
                        <h1 class="auth-title">注册</h1>
                        <p class="auth-subtitle">加入 AIHOTNESS，追踪 AI 前沿</p>
                    </div>
                    <form id="registerForm" class="auth-form">
                        <div class="form-group">
                            <label class="form-label">用户名</label>
                            <input type="text" id="regUsername" class="form-input" placeholder="字母、数字、中文" required autocomplete="username" minlength="3">
                        </div>
                        <div class="form-group">
                            <label class="form-label">邮箱</label>
                            <input type="email" id="regEmail" class="form-input" placeholder="your@email.com" required autocomplete="email">
                        </div>
                        <div class="form-group">
                            <label class="form-label">密码</label>
                            <input type="password" id="regPassword" class="form-input" placeholder="至少 6 位" required autocomplete="new-password" minlength="6">
                        </div>
                        <div class="form-group">
                            <label class="form-label">确认密码</label>
                            <input type="password" id="regConfirm" class="form-input" placeholder="再次输入密码" required autocomplete="new-password">
                        </div>
                        <div class="form-error" id="registerError" style="display:none;"></div>
                        <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
                            注册
                        </button>
                    </form>
                    <div class="auth-footer">
                        <span>已有账号？</span>
                        <a href="/login" class="auth-link-inline">去登录</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
